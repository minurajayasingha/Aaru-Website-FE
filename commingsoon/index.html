<style>
  :root {
    --cream: #f4f2ee;
    --cream-dark: #e9e4d8;
    --forest-900: #173329;
    --forest-800: #122a1c;
    --forest-700: #1c3524;
    --forest-600: #2b4834;
    --forest-500: #3c5c46;
    --gold: #b5915d;
    --gold-light: #d4b483;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    position: relative;
    background-color: var(--cream);
    background-image: radial-gradient(circle at 50% 38%, #faf8f4 0%, var(--cream) 45%, var(--cream-dark) 100%);
    color: var(--forest-700);
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 1.5rem;
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.035;
    mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  .wrap {
    max-width: 640px;
    width: 100%;
    text-align: center;
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 1s ease, transform 1s ease;
  }

  body.loaded .wrap {
    opacity: 1;
    transform: translateY(0);
  }

  .mark {
    width: 84px;
    height: auto;
    margin: 0 auto;
    display: block;
  }

  .wordmark {
    margin: 0.35rem 0 0;
    font-family: 'Marcellus SC', serif;
    font-size: clamp(0.7rem, 1.5vw, 0.85rem);
    letter-spacing: 0.42em;
    text-indent: 0.42em;
    color: var(--forest-600);
    text-transform: uppercase;
  }

  .divider {
    width: 44px;
    height: 1px;
    background: var(--gold);
    margin: 2rem auto;
  }

  h1 {
    margin: 0;
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-size: clamp(2.75rem, 8vw, 4.5rem);
    line-height: 1;
    letter-spacing: -0.02em;
    color: var(--forest-900);
    cursor: default;
    animation: float 5s ease-in-out infinite;
    transition: color 0.4s ease, letter-spacing 0.4s ease, transform 0.4s ease;
  }

  h1:hover {
    color: var(--gold);
    letter-spacing: 0em;
    animation-play-state: paused;
    transform: translateY(-10px) scale(1.015);
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  .tagline {
    margin: 1.25rem auto 0;
    max-width: 32ch;
    font-weight: 300;
    font-size: clamp(1rem, 2vw, 1.125rem);
    line-height: 1.6;
    color: var(--forest-600);
  }

  .contact-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 0.9rem;
    margin-top: 2.75rem;
  }

  .contact-pill {
    display: inline-flex;
    align-items: center;
    gap: 0.55rem;
    padding: 0.7rem 1.4rem;
    border-radius: 0.375rem;
    border: 1px solid var(--forest-700);
    color: var(--forest-900);
    font-size: 0.875rem;
    font-weight: 400;
    text-decoration: none;
    letter-spacing: 0.01em;
    transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
  }

  .contact-pill:hover,
  .contact-pill:focus-visible {
    background-color: var(--gold);
    border-color: var(--gold);
    color: #fff;
  }

  .contact-pill svg {
    flex-shrink: 0;
  }

  .contact-pill svg path {
    fill: currentColor;
  }

  footer {
    margin-top: 3.5rem;
    font-size: 0.7rem;
    letter-spacing: 0.05em;
    color: var(--forest-500);
  }

  @media (max-width: 420px) {
    .contact-row {
      flex-direction: column;
      gap: 0.75rem;
    }
    .contact-pill {
      width: 100%;
      justify-content: center;
    }
  }
</style>
